[package]
authors = ["Avikalpa Kundu <avi@gour.top>"]
name = "ytrace"
version = "0.2.3"
edition = "2021"
description = "ytrace — DTrace-like probe library for ytop fleet introspection; providers emit spans/events/metrics, ytop discovers and queries them"
license = "MIT"
repository = "https://github.com/yggdrasilhq/ytrace"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
